version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: "monday"
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: "/docker/ex"
    schedule:
      interval: weekly
      day: "monday"
    commit-message:
      prefix: "build"
