version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    # TypeScript 7 ships no compiler API, so typescript-eslint cannot run against it
    # (typescript-eslint#12518 closed as "not planned"; support is deferred to TS 7.1).
    # Bumping past 6.x breaks `pnpm lint` outright, not just a warning. Remove this
    # block once typescript-eslint announces >=7.1 support.
    ignore:
      - dependency-name: typescript
        versions: ["7.x"]
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: "monday"
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: "/docker/ex"
    schedule:
      interval: weekly
      day: "monday"
    commit-message:
      prefix: "build"
