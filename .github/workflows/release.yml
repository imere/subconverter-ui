name: Release

# Two publish channels:
#   push to main  -> rolling :alpha image (amd64 only, fast feedback)
#   push tag v*   -> versioned + :latest image (amd64 + arm64) and GitHub Release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a tagged release build; queued alpha builds may be dropped.
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  image:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        if: github.ref_type == 'tag'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=alpha,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/ex/Dockerfile
          # Alpha is a fast-feedback channel: amd64 only. Tagged releases are multi-arch.
          platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release notes
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            README.md
            docker/ex/compose.yml
            docker/ex/Dockerfile
            docker/ex/nginx.conf
