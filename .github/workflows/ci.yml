name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Test · Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Pin the scanner: a floating tag would let an upstream release silently
      # change what "clean" means. Bump deliberately.
      GITLEAKS_VERSION: 8.30.1
    strategy:
      # One platform failing must not hide the other two.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # fetch-depth: 0 — gitleaks must see the whole history, not just the tip.
      # With the default depth 1 a secret buried in an old commit is invisible.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # Must match the pnpm major used locally (see pnpm-workspace.yaml).
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Single source of truth: .nvmrc pins Node 24.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        # HUSKY=0 skips the `prepare` hook; git hooks are a local-only concern.
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      # CI is the backstop for anyone who bypasses the local hooks with
      # --no-verify. Unlike them it cannot be skipped — but it also runs AFTER
      # the commit exists, so a finding here means the credential is already on
      # the remote and MUST be rotated. Runs once, on Linux.
      #
      # We download the pinned binary instead of using gitleaks-action: the
      # action requires a license key for organisation accounts, and a plain
      # download keeps CI behaviour identical to the local hooks.
      - name: Install gitleaks
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # `--diff-merges=first-parent`: gitleaks enumerates only non-merge
      # commits, so content introduced by a merge (a conflict resolution, say)
      # would otherwise never reach the scanner.
      - name: Secret scan (full history)
        if: matrix.os == 'ubuntu-latest'
        run: gitleaks detect --source . --redact --config .gitleaks.toml --log-opts="HEAD --diff-merges=first-parent"

      # The zero-dependency fallback stays in the loop so it cannot rot
      # unnoticed: if it starts failing while gitleaks passes, it is a bug in
      # our own scanner, not a leak.
      - name: Secret scan (fallback scanner, tree mode)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm secret:scan

      - name: Lint
        run: pnpm lint

      - name: Test (with coverage)
        run: pnpm test:cov

      # NOTE: must run BEFORE `pnpm build`. Both the bundle and coverage land in
      # build/, and vite's `emptyOutDir` clears all of build/ on the next step.
      # Artifacts are byte-identical across platforms, so publish them once
      # (from Linux) instead of three redundant copies.
      - name: Upload coverage
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: build/coverage/
          retention-days: 14

      - name: Build
        run: pnpm build

      - name: Upload build output
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: webui-build
          path: build/
          retention-days: 14

  image:
    name: Validate Docker image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - name: Build webui image (validates Dockerfile)
        run: docker build -f docker/ex/Dockerfile -t subconverter-webui:ci .
