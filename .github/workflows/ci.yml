name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Test · Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide the other two.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # Must match the pnpm major used locally (see pnpm-workspace.yaml).
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Single source of truth: .nvmrc pins Node 24.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        # HUSKY=0 skips the `prepare` hook; git hooks are a local-only concern.
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      # Same scanner as the pre-commit hook (CI is the backstop for anyone who
      # bypasses hooks with --no-verify). Runs once, on Linux.
      - name: Secret scan
        if: matrix.os == 'ubuntu-latest'
        run: pnpm secret:scan

      - name: Lint
        run: pnpm lint

      - name: Test (with coverage)
        run: pnpm test:cov

      # NOTE: must run BEFORE `pnpm build`. Both the bundle and coverage land in
      # build/, and vite's `emptyOutDir` clears all of build/ on the next step.
      # Artifacts are byte-identical across platforms, so publish them once
      # (from Linux) instead of three redundant copies.
      - name: Upload coverage
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/coverage/
          retention-days: 14

      - name: Build
        run: pnpm build

      - name: Upload build output
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: webui-build
          path: build/
          retention-days: 14

  image:
    name: Validate Docker image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - name: Build webui image (validates Dockerfile)
        run: docker build -f docker/ex/Dockerfile -t subconverter-webui:ci .
