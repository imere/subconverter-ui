server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown route returns the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Reverse proxy to the internal subconverter service ----
    # The subconverter container is NOT exposed to the host; it is only
    # reachable through this proxy on the shared `sc-net` network.
    # This keeps a single origin for the browser, eliminating CORS.

    location /sub {
        proxy_pass http://subconverter:25500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /version {
        proxy_pass http://subconverter:25500;
    }

    location /getruleset {
        proxy_pass http://subconverter:25500;
    }

    location /getprofile {
        proxy_pass http://subconverter:25500;
    }

    location /render {
        proxy_pass http://subconverter:25500;
    }

    location /refreshrules {
        proxy_pass http://subconverter:25500;
    }
}
